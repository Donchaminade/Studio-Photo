<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <th:block th:replace="~{admin/fragments/favicon :: favicon}"></th:block>
    <title>Connexion admin — PICON</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        body.picon-login {
            font-family: 'Segoe UI', 'Roboto', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 16px;
            color: #1F2937;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 22px;
            box-shadow: 0 18px 40px rgba(1, 22, 62, 0.12);
        }

        .form-section {
            padding: 36px 32px 28px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            margin-bottom: 22px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            min-width: 64px;
            border-radius: 16px;
            overflow: hidden;
            margin-right: 12px;
            background: #fff;
            border: 1px solid #E3E8F0;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #fff;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 800;
            color: #01163E;
            letter-spacing: -0.3px;
            line-height: 1.1;
        }

        .tagline {
            color: #757575;
            font-size: 13px;
            margin-top: 2px;
        }

        .form-section h2 {
            margin: 0 0 22px;
            color: #01163E;
            font-weight: 700;
            font-size: 22px;
            position: relative;
            padding-bottom: 12px;
        }

        .form-section h2::after {
            content: '';
            position: absolute;
            width: 48px;
            height: 3px;
            background: #01163E;
            bottom: 0;
            left: 0;
            border-radius: 3px;
        }

        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #01163E;
            margin-bottom: 6px;
        }

        .login-field {
            position: relative;
            margin-bottom: 16px;
        }

        .login-field > i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #757575;
            font-size: 15px;
            z-index: 2;
            pointer-events: none;
        }

        .login-field .form-control {
            height: 48px;
            border-radius: 16px;
            border: 1px solid #E3E8F0;
            background: #F8FAFC;
            padding: 10px 44px;
            font-size: 15px;
            color: #1F2937;
        }

        .login-field .form-control:focus {
            border-color: #01163E;
            box-shadow: 0 0 0 0.15rem rgba(1, 22, 62, 0.12);
            background: #fff;
        }

        .password-toggle {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: #757575;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 10px;
        }

        .password-toggle:hover {
            color: #01163E;
        }

        .btn-login {
            background: #01163E;
            border: none;
            border-radius: 16px;
            height: 48px;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            margin-top: 6px;
        }

        .btn-login:hover,
        .btn-login:focus {
            background: #032A85;
            color: #fff;
        }

        .alert {
            border-radius: 12px;
            font-size: 14px;
            border: none;
        }

        .alert-danger {
            background-color: rgba(211, 47, 47, 0.1);
            color: #D32F2F;
        }

        .alert-success {
            background-color: rgba(31, 157, 85, 0.1);
            color: #1F9D55;
        }
    </style>
    <th:block th:replace="~{admin/fragments/picon-assets :: styles}"></th:block>
</head>
<body class="picon-login">
<div class="login-container">
    <div class="form-section">
        <div class="logo-container">
            <div class="logo-icon">
                <img th:src="@{/images/picon-logo.png}" alt="PICON">
            </div>
            <div>
                <div class="logo-text">PICON</div>
                <div class="tagline">Gestion professionnelle des photos</div>
            </div>
        </div>

        <h2>Connexion Administrateur</h2>

        <form th:action="@{/admin/login}" method="post">
            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-circle mr-2"></i>
                Email ou mot de passe invalide.
            </div>
            <div th:if="${param.logout}" class="alert alert-success" role="alert">
                <i class="fas fa-check-circle mr-2"></i>
                Vous avez été déconnecté avec succès.
            </div>

            <label class="field-label" for="username">Identifiant</label>
            <div class="login-field">
                <i class="fas fa-envelope"></i>
                <input type="email" id="username" name="username" class="form-control"
                       placeholder="Adresse email" autocomplete="username" required autofocus>
            </div>

            <label class="field-label" for="password">Mot de passe</label>
            <div class="login-field">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Mot de passe" autocomplete="current-password" required>
                <button type="button" class="password-toggle" id="togglePassword" aria-label="Afficher le mot de passe">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <button class="btn btn-login btn-block" type="submit">Connexion</button>
        </form>
    </div>
</div>

<script>
    document.getElementById('togglePassword').addEventListener('click', function () {
        var passwordInput = document.getElementById('password');
        var eyeIcon = this.querySelector('i');
        var visible = passwordInput.type === 'text';
        passwordInput.type = visible ? 'password' : 'text';
        eyeIcon.classList.toggle('fa-eye', visible);
        eyeIcon.classList.toggle('fa-eye-slash', !visible);
        this.setAttribute('aria-label', visible ? 'Afficher le mot de passe' : 'Masquer le mot de passe');
    });
</script>
<th:block th:replace="~{admin/fragments/picon-assets :: scripts}"></th:block>
</body>
</html>

# Nginx — api.photopicon.com → backend Windows (192.168.1.110:8081)
# Copier sur le VPS Ubuntu : /etc/nginx/sites-available/api.photopicon.com
# Puis : sudo ln -sf ... sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name api.photopicon.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.photopicon.com;

    # Certificats SSL (adapter les chemins selon votre install : certbot, etc.)
    ssl_certificate     /etc/letsencrypt/live/api.photopicon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.photopicon.com/privkey.pem;

    # Uploads admin + photos commandes (aligné sur Spring Boot : 200 Mo)
    client_max_body_size 200M;
    client_body_timeout 300s;

    location / {
        proxy_pass http://192.168.1.110:8081;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
